openapi: 3.0.3
info:
  title: API Distribuidora Vetor
  version: 1.0.0
  description: API REST para gerenciamento de clientes e vendedores.
paths:
  /api/auth/token/:
    post:
      operationId: auth_token_create
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/clientes/:
    get:
      operationId: clientes_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: precisa_revisao
        schema:
          type: boolean
        description: Filtra clientes marcados (true) ou não marcados (false) para
          revisão.
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClienteList'
          description: ''
    post:
      operationId: clientes_create
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cliente'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
  /api/clientes/{id}/:
    get:
      operationId: clientes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente.
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    put:
      operationId: clientes_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente.
        required: true
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cliente'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    patch:
      operationId: clientes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente.
        required: true
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    delete:
      operationId: clientes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente.
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/clientes/bairro/{nome}/:
    get:
      operationId: clientes_bairro_list
      parameters:
      - in: path
        name: nome
        schema:
          type: string
        description: Nome do bairro para filtrar os clientes.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: precisa_revisao
        schema:
          type: boolean
        description: Filtra clientes marcados (true) ou não marcados (false) para
          revisão.
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClienteList'
          description: ''
  /api/clientes/bairros/:
    get:
      operationId: clientes_bairros_list
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumoBairro'
          description: ''
  /api/clientes/vendedor/{id}/:
    get:
      operationId: clientes_vendedor_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: precisa_revisao
        schema:
          type: boolean
        description: Filtra clientes marcados (true) ou não marcados (false) para
          revisão.
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClienteList'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/token/:
    post:
      operationId: token_create
      tags:
      - token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/vendedores/:
    get:
      operationId: vendedores_list
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendedor'
          description: ''
    post:
      operationId: vendedores_create
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
  /api/vendedores/{id}/:
    get:
      operationId: vendedores_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    put:
      operationId: vendedores_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    patch:
      operationId: vendedores_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    delete:
      operationId: vendedores_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendedorComClientes'
          description: O vendedor possui clientes vinculados.
  /api/vendedores/{id}/clientes/:
    get:
      operationId: vendedores_clientes_list
      description: Lista de clientes do vendedor. CNPJ, telefone e e-mail exigem autenticação.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Cliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_cliente:
          type: string
          maxLength: 20
        razao_social:
          type: string
          maxLength: 200
        bairro:
          type: string
          nullable: true
          maxLength: 100
        cep:
          type: string
          nullable: true
          maxLength: 10
        cidade:
          type: string
          maxLength: 100
        uf:
          type: string
          maxLength: 2
        data_cadastro:
          type: string
          format: date
          nullable: true
        vendedor_responsavel:
          type: integer
        precisa_revisao:
          type: boolean
          readOnly: true
        cnpj:
          type: string
          nullable: true
          maxLength: 18
        telefone:
          type: string
          nullable: true
          maxLength: 20
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - cidade
      - id
      - id_cliente
      - precisa_revisao
      - razao_social
      - uf
      - vendedor_responsavel
    PaginatedClienteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Cliente'
    PatchedCliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_cliente:
          type: string
          maxLength: 20
        razao_social:
          type: string
          maxLength: 200
        bairro:
          type: string
          nullable: true
          maxLength: 100
        cep:
          type: string
          nullable: true
          maxLength: 10
        cidade:
          type: string
          maxLength: 100
        uf:
          type: string
          maxLength: 2
        data_cadastro:
          type: string
          format: date
          nullable: true
        vendedor_responsavel:
          type: integer
        precisa_revisao:
          type: boolean
          readOnly: true
        cnpj:
          type: string
          nullable: true
          maxLength: 18
        telefone:
          type: string
          nullable: true
          maxLength: 20
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
    PatchedVendedor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
    ResumoBairro:
      type: object
      properties:
        bairro:
          type: string
          nullable: true
        total:
          type: integer
          minimum: 0
      required:
      - bairro
      - total
    Vendedor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
      required:
      - id
      - nome
    VendedorComClientes:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
